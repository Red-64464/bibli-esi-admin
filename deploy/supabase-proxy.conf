limit_req_zone $binary_remote_addr zone=bibliesi_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bibliesi_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=bibliesi_conn:10m;

server {
  listen 80;
  server_name _;
  client_max_body_size 80m;

  # Docker peut recréer Kong avec une nouvelle adresse IP. Cette résolution
  # dynamique évite que le proxy conserve une ancienne adresse et coupe les
  # rappels automatiques ou le temps réel.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $supabase_kong supabase-kong;

  # Protection générale contre les rafales de requêtes et les connexions abusives.
  limit_req_status 429;
  limit_conn_status 429;
  limit_conn bibliesi_conn 20;

  location ~ ^/auth/v1/(token|signup) {
    limit_req zone=bibliesi_auth burst=5 nodelay;
    proxy_pass http://$supabase_kong:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    limit_req zone=bibliesi_api burst=60 nodelay;
    proxy_pass http://$supabase_kong:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
